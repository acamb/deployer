#client
host: localhost
port: 7676
name: test
image_name: test
build_method: compose
# dedicated key generated by testenv/server/create.sh (public part is in the
# deployer-server authorized_keys)
private_key: ~/.ssh/deployer_test
enable_revisions: true
revisions_remove_previous: true
#ekvs_enable: true
#ekvs_server: http://webapp.local:9000
#ekvs_project: test
#ekvs_private_key: ~/.ssh/ekvs
continuity_enable: true
continuity_config: ./continuity-client.yaml
continuity_pool: test.local
continuity_health_check_path: /health
continuity_internal_port: '8080'
continuity_remove_previous: true
# deployer-managed key path: the client sends this key to the server, which
# stores it and rewrites auth_key in continuity-client.yaml. Generated by
# testenv/server/create.sh, whose public part authorizes it on continuity.
#continuity_private_key: ~/.ssh/continuity_test
# base URL under which the container is reachable by continuity: within the
# testenv the deployer server is the "docker" host (dind).
continuity_advertise_base: http://docker