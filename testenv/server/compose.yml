services:
  docker:
    container_name: docker
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs
  continuity:
    container_name: continuity
    # The image tag MUST match the CONTINUITY_VERSION build arg below (version
    # lockstep — the CLI aborts every command when its version differs).
    image: acamb23/continuity-server:0.2.0
    ports:
      # management/API port used by the `continuity` CLI
      - "8090:8090"
      # load balancer port
      - "8081:80"
    volumes:
      # mounted read-only: continuity's autosave will fail harmlessly (see the
      # config file). The pool state lives in-memory and is re-populated by the
      # deployer reconciliation loop.
      - ./continuity-server.yaml:/opt/continuity/config.yaml:ro
      # public key(s) allowed to authenticate against the management API,
      # generated by create.sh before `docker compose up`.
      - ./continuity-authorized-keys:/opt/continuity/authorized_keys:ro
  deployer-test-server:
    container_name: deployer-test-server
    build:
        context: .
        dockerfile: Dockerfile
        args:
           SSH_PUBLIC_KEY: "${SSH_PUBLIC_KEY}"
           HOST_RSA_KEY: "${HOST_RSA_KEY}"
           # must match the acamb23/continuity-server image tag of the
           # continuity service above (version lockstep)
           CONTINUITY_VERSION: "0.2.0"
    ports:
        - "7676:7676"
    volumes:
        - ../../bin/deployer-server_dev:/usr/bin/deployer-server
        - docker-certs:/certs:ro
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: 1
      DOCKER_CERT_PATH: /certs/client
    depends_on:
      - docker
      - continuity
volumes:
  docker-certs: {}