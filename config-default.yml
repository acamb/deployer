port: 7676
listenAddress: 0.0.0.0
workingDirectory: /opt/deployer
hostKeyPath: /opt/deployer/host_rsa_key
# Optional path to the `ekvs` CLI binary used for EKVS secret injection.
# When unset, the server uses `ekvs` from PATH.
# ekvs_bin: /usr/local/bin/ekvs

# Optional path to the `continuity` CLI binary used for the load balancer
# integration. When unset, the server uses `continuity` from PATH.
# The CLI version must match the Continuity server version (version lockstep).
# continuity_bin: /usr/local/bin/continuity
